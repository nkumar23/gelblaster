<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Gel Blaster</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #ui-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 10;
  }
  #ui-overlay.active { pointer-events: all; }
  #start-screen, #game-over-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    text-align: center;
    color: #00ff88;
    text-shadow: 0 0 10px #00ff88, 0 0 20px #00ff44;
  }
  #start-screen.visible, #game-over-screen.visible { display: flex; }
  h1 {
    font-size: clamp(2rem, 8vw, 4rem);
    margin-bottom: 0.5rem;
    color: #00ffaa;
    text-shadow: 0 0 15px #00ffaa, 0 0 30px #00ff66;
    letter-spacing: 0.2em;
  }
  .subtitle {
    font-size: clamp(0.7rem, 2.5vw, 1rem);
    color: #66ffbb;
    margin-bottom: 2rem;
    opacity: 0.8;
  }
  .btn {
    font-family: 'Courier New', monospace;
    font-size: clamp(1rem, 3vw, 1.4rem);
    color: #000;
    background: #00ff88;
    border: none;
    padding: 0.8em 2em;
    cursor: pointer;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin: 0.5rem;
    box-shadow: 0 0 15px #00ff44;
    transition: all 0.15s;
  }
  .btn:hover, .btn:active {
    background: #66ffbb;
    box-shadow: 0 0 25px #00ff88;
  }
  .controls-info {
    font-size: clamp(0.6rem, 2vw, 0.8rem);
    color: #448866;
    margin-top: 1.5rem;
    line-height: 1.6;
  }
  #final-score {
    font-size: clamp(1.5rem, 5vw, 2.5rem);
    color: #ff4444;
    text-shadow: 0 0 10px #ff2222;
    margin: 1rem 0;
  }
  #touch-controls {
    display: none;
    position: fixed;
    bottom: 10px;
    left: 0; right: 0;
    justify-content: space-between;
    padding: 0 15px;
    z-index: 20;
    pointer-events: none;
  }
  #touch-controls.visible {
    display: flex;
  }
  .touch-btn {
    width: 60px;
    height: 60px;
    background: rgba(0, 255, 136, 0.15);
    border: 2px solid rgba(0, 255, 136, 0.4);
    border-radius: 50%;
    color: #00ff88;
    font-size: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: all;
    -webkit-tap-highlight-color: transparent;
  }
  .touch-btn:active {
    background: rgba(0, 255, 136, 0.35);
  }
  .touch-hint {
    color: rgba(0, 255, 136, 0.4);
    font-family: 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    pointer-events: none;
    align-self: center;
    padding-bottom: 4px;
  }
  .touch-fire {
    width: 80px;
    height: 80px;
    font-size: 14px;
    letter-spacing: 0.1em;
    border-radius: 50%;
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="ui-overlay" class="active">
  <div id="start-screen" class="visible">
    <h1>GEL BLASTER</h1>
    <div class="subtitle">&#9876; Defend the gel from rogue DNA bands &#9876;</div>
    <button class="btn" id="start-btn">START</button>
    <div class="controls-info">
      WASD / Arrow Keys to move<br>
      SPACE to fire<br>
      Touch controls on mobile
    </div>
  </div>
  <div id="game-over-screen">
    <h1>GEL RUINED</h1>
    <div id="final-score"></div>
    <button class="btn" id="restart-btn">TRY AGAIN</button>
  </div>
</div>

<div id="touch-controls">
  <div class="touch-hint">&#9664; swipe to move &#9654;</div>
  <button class="touch-btn touch-fire" data-action="fire">FIRE</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// --- Responsive sizing ---
const BASE_W = 400;
const BASE_H = 600;
let scale = 1;

function resize() {
  const maxW = window.innerWidth;
  const maxH = window.innerHeight;
  scale = Math.min(maxW / BASE_W, maxH / BASE_H);
  canvas.width = BASE_W;
  canvas.height = BASE_H;
  canvas.style.width = (BASE_W * scale) + 'px';
  canvas.style.height = (BASE_H * scale) + 'px';
}
resize();
window.addEventListener('resize', resize);

// ============================================================
// 8-BIT SOUND ENGINE (Web Audio API — no files needed)
// ============================================================
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playTone(freq, duration, type, volume, slide, delay) {
  const ac = ensureAudio();
  const t = ac.currentTime + (delay || 0);
  const osc = ac.createOscillator();
  const gain = ac.createGain();
  osc.type = type || 'square';
  osc.frequency.setValueAtTime(freq, t);
  if (slide) osc.frequency.linearRampToValueAtTime(slide, t + duration);
  gain.gain.setValueAtTime(volume || 0.1, t);
  gain.gain.linearRampToValueAtTime(0, t + duration);
  osc.connect(gain);
  gain.connect(ac.destination);
  osc.start(t);
  osc.stop(t + duration);
}

function playNoise(duration, volume, delay) {
  const ac = ensureAudio();
  const t = ac.currentTime + (delay || 0);
  const bufSize = ac.sampleRate * duration;
  const buf = ac.createBuffer(1, bufSize, ac.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
  const src = ac.createBufferSource();
  src.buffer = buf;
  const gain = ac.createGain();
  gain.gain.setValueAtTime(volume || 0.08, t);
  gain.gain.linearRampToValueAtTime(0, t + duration);
  src.connect(gain);
  gain.connect(ac.destination);
  src.start(t);
}

const SFX = {
  shoot() {
    playTone(880, 0.06, 'square', 0.07, 440);
  },
  hit() {
    playTone(200, 0.1, 'square', 0.1, 80);
    playNoise(0.08, 0.06);
  },
  kill() {
    playTone(400, 0.08, 'square', 0.1, 200);
    playTone(300, 0.1, 'square', 0.08, 100, 0.05);
    playNoise(0.12, 0.08, 0.02);
  },
  playerHit() {
    playTone(150, 0.2, 'sawtooth', 0.12, 40);
    playNoise(0.25, 0.1);
  },
  powerup() {
    playTone(523, 0.08, 'square', 0.1);
    playTone(659, 0.08, 'square', 0.1, 0, 0.08);
    playTone(784, 0.08, 'square', 0.1, 0, 0.16);
    playTone(1047, 0.15, 'square', 0.12, 0, 0.24);
  },
  uvFlash() {
    playTone(100, 0.4, 'sawtooth', 0.15, 2000);
    playNoise(0.5, 0.12);
  },
  waveComplete() {
    const notes = [523, 659, 784, 1047];
    notes.forEach((n, i) => {
      playTone(n, 0.12, 'square', 0.09, 0, i * 0.1);
    });
    playTone(1047, 0.3, 'triangle', 0.08, 0, 0.4);
  },
  gameOver() {
    const notes = [400, 350, 300, 200];
    notes.forEach((n, i) => {
      playTone(n, 0.25, 'square', 0.1, n - 50, i * 0.2);
    });
    playNoise(0.6, 0.06, 0.6);
  },
  enemyShoot() {
    playTone(220, 0.08, 'triangle', 0.04, 110);
  },
  gelComb() {
    playTone(300, 0.15, 'triangle', 0.1, 600);
    playTone(450, 0.2, 'triangle', 0.08, 150, 0.1);
  },
};

// --- Touch detection ---
const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
if (isTouchDevice) {
  document.getElementById('touch-controls').classList.add('visible');
}

// --- Game State ---
let gameState = 'menu'; // menu, playing, gameover
let score = 0;
let lives = 3;
let wave = 1;
let frameCount = 0;
let shakeTimer = 0;
let particles = [];
let bullets = [];
let enemyBullets = [];
let enemies = [];
let powerups = [];
let starfield = [];
let floatingTexts = [];

// --- Active power-up timers ---
let tripleShot = 0;      // frames remaining
let rapidFire = 0;       // frames remaining
let shieldHP = 0;         // hits remaining
let uvFlashTimer = 0;     // flash animation frames

// --- Player ---
const player = {
  x: BASE_W / 2,
  y: BASE_H - 50,
  w: 28,
  h: 20,
  speed: 3.5,
  baseFireRate: 12,
  fireRate: 12,
  fireCooldown: 0,
  invincible: 0,
  dx: 0,
};

// --- Input ---
const keys = {};
const touchState = { fire: false };

document.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase())) {
    e.preventDefault();
  }
});
document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// Touch button handlers
document.querySelectorAll('.touch-btn').forEach(btn => {
  const dir = btn.dataset.dir;
  const action = btn.dataset.action;

  const onStart = (e) => {
    e.preventDefault();
    ensureAudio();
    if (action === 'fire') touchState.fire = true;
  };
  const onEnd = (e) => {
    e.preventDefault();
    if (action === 'fire') touchState.fire = false;
  };

  btn.addEventListener('touchstart', onStart, { passive: false });
  btn.addEventListener('touchend', onEnd, { passive: false });
  btn.addEventListener('touchcancel', onEnd, { passive: false });
  btn.addEventListener('mousedown', onStart);
  btn.addEventListener('mouseup', onEnd);
  btn.addEventListener('mouseleave', onEnd);
});

// Swipe-to-move on canvas for mobile
let touchX = null;
canvas.addEventListener('touchstart', e => {
  if (gameState !== 'playing') return;
  touchX = e.touches[0].clientX;
  e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  if (gameState !== 'playing' || touchX === null) return;
  const newX = e.touches[0].clientX;
  const dx = (newX - touchX) / scale;
  player.x += dx * 0.8;
  touchX = newX;
  e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchend', () => { touchX = null; });

function isDown(action) {
  switch(action) {
    case 'left': return keys['a'] || keys['arrowleft'];
    case 'right': return keys['d'] || keys['arrowright'];
    case 'up': return keys['w'] || keys['arrowup'];
    case 'down': return keys['s'] || keys['arrowdown'];
    case 'fire': return keys[' '] || touchState.fire;
  }
}

// --- Starfield (gel bubbles) ---
function initStarfield() {
  starfield = [];
  for (let i = 0; i < 40; i++) {
    starfield.push({
      x: Math.random() * BASE_W,
      y: Math.random() * BASE_H,
      r: Math.random() * 1.5 + 0.5,
      speed: Math.random() * 0.3 + 0.1,
      alpha: Math.random() * 0.3 + 0.05,
    });
  }
}
initStarfield();

// --- Floating text ---
function spawnFloatingText(x, y, text, color) {
  floatingTexts.push({ x, y, text, color, life: 40, maxLife: 40 });
}

function updateFloatingTexts() {
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y -= 0.8;
    ft.life--;
    if (ft.life <= 0) floatingTexts.splice(i, 1);
  }
}

function drawFloatingTexts() {
  for (const ft of floatingTexts) {
    const alpha = ft.life / ft.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = ft.color;
    ctx.shadowColor = ft.color;
    ctx.shadowBlur = 6;
    ctx.font = 'bold 10px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(ft.text, ft.x, ft.y);
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}

// --- Draw DNA Band (the "invader") ---
function drawDNABand(x, y, w, h, color, variant) {
  ctx.save();
  ctx.translate(x, y);

  ctx.shadowColor = color;
  ctx.shadowBlur = 6;
  ctx.fillStyle = color;

  const bw = w;
  const bh = h * 0.5;
  ctx.fillRect(-bw/2, -bh/2, bw, bh);

  ctx.shadowBlur = 4;
  const earW = w * 0.22;
  const earH = h * 0.45;

  if (variant === 0) {
    ctx.fillRect(-bw/2 - earW * 0.3, -bh/2 - earH, earW, earH);
    ctx.fillRect(bw/2 - earW + earW * 0.3, -bh/2 - earH, earW, earH);
    ctx.fillRect(-bw/2 + earW * 0.5, -bh/2 - earH * 0.3, bw - earW, earH * 0.3);
  } else if (variant === 1) {
    ctx.beginPath();
    ctx.moveTo(-bw/2, -bh/2);
    ctx.lineTo(-bw/2 - earW * 0.5, -bh/2 - earH * 0.8);
    ctx.lineTo(-bw/2 + earW * 0.8, -bh/2 - earH * 0.3);
    ctx.lineTo(bw/2 - earW * 0.8, -bh/2 - earH * 0.3);
    ctx.lineTo(bw/2 + earW * 0.5, -bh/2 - earH * 0.8);
    ctx.lineTo(bw/2, -bh/2);
    ctx.fill();
  } else {
    ctx.fillRect(-bw/2 - 2, -bh/2 - earH * 0.4, bw + 4, bh + earH * 0.4);
    ctx.fillRect(-bw/2 - earW * 0.2, -bh/2 - earH * 0.7, earW * 0.7, earH * 0.4);
    ctx.fillRect(bw/2 - earW * 0.5, -bh/2 - earH * 0.7, earW * 0.7, earH * 0.4);
  }

  ctx.globalAlpha = 0.3;
  ctx.fillRect(-bw/2, bh/2, bw, h * 0.15);

  ctx.restore();
}

// --- Draw Player (pipette tip / micropipettor) ---
function drawPlayer(x, y) {
  ctx.save();
  ctx.translate(x, y);

  const glowColor = shieldHP > 0 ? '#ff44ff' : (tripleShot > 0 ? '#ffaa00' : '#00ff88');

  ctx.shadowColor = glowColor;
  ctx.shadowBlur = shieldHP > 0 ? 14 : 8;
  ctx.fillStyle = glowColor;

  ctx.beginPath();
  ctx.moveTo(0, -12);
  ctx.lineTo(-4, 2);
  ctx.lineTo(4, 2);
  ctx.closePath();
  ctx.fill();

  ctx.fillRect(-6, 2, 12, 8);

  ctx.fillStyle = shieldHP > 0 ? '#cc44cc' : '#00cc66';
  ctx.fillRect(-8, 6, 16, 2);
  ctx.fillRect(-7, 10, 14, 3);

  ctx.fillStyle = rapidFire > 0 ? '#ff4444' : '#88ffbb';
  ctx.fillRect(-2, -14, 4, 4);

  // Draw shield ring
  if (shieldHP > 0) {
    ctx.strokeStyle = '#ff66ff';
    ctx.shadowColor = '#ff66ff';
    ctx.shadowBlur = 10;
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.5 + Math.sin(frameCount * 0.15) * 0.3;
    ctx.beginPath();
    ctx.arc(0, 0, 18, 0, Math.PI * 2);
    ctx.stroke();
    // Draw little plasmid nicks
    for (let i = 0; i < shieldHP; i++) {
      const a = (i / 3) * Math.PI * 2 + frameCount * 0.03;
      ctx.fillStyle = '#ffaaff';
      ctx.fillRect(Math.cos(a) * 18 - 1.5, Math.sin(a) * 18 - 1.5, 3, 3);
    }
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

// ============================================================
// POWER-UP SYSTEM
// ============================================================
// Types:
//   etbr     — EtBr Boost: triple-shot spread for 8 seconds
//   pcr      — PCR Amplify: rapid fire (3x speed) for 6 seconds
//   plasmid  — Shield Plasmid: circular shield absorbs 3 hits
//   uv       — UV Flash: kills all enemies on screen (screen flash)
//   comb     — Gel Comb: freezes/slows enemies for 5 seconds
//   extralife — Extra Life: +1 life (rare)

const POWERUP_TYPES = [
  { type: 'etbr',     color: '#ff8800', label: 'EtBr',    chance: 0.25, symbol: 'E' },
  { type: 'pcr',      color: '#ff4444', label: 'PCR',     chance: 0.25, symbol: 'P' },
  { type: 'plasmid',  color: '#ff44ff', label: 'SHIELD',  chance: 0.18, symbol: 'O' },
  { type: 'uv',       color: '#aa88ff', label: 'UV',      chance: 0.10, symbol: 'U' },
  { type: 'comb',     color: '#44ddff', label: 'COMB',    chance: 0.15, symbol: 'C' },
  { type: 'extralife',color: '#44ff44', label: '+1 UP',   chance: 0.07, symbol: '+' },
];

let combSlowTimer = 0;

function maybeSpawnPowerup(x, y) {
  // ~8% chance per kill
  if (Math.random() > 0.08) return;

  // Weighted random pick
  let roll = Math.random();
  let cumulative = 0;
  let chosen = POWERUP_TYPES[0];
  for (const pt of POWERUP_TYPES) {
    cumulative += pt.chance;
    if (roll <= cumulative) { chosen = pt; break; }
  }

  powerups.push({
    x, y,
    vy: 2.5,
    type: chosen.type,
    color: chosen.color,
    label: chosen.label,
    symbol: chosen.symbol,
    life: 600,
    bobPhase: Math.random() * Math.PI * 2,
  });
}

function activatePowerup(pu) {
  SFX.powerup();
  spawnFloatingText(pu.x, pu.y - 15, pu.label, pu.color);

  switch (pu.type) {
    case 'etbr':
      tripleShot = 480; // 8 seconds at 60fps
      spawnFloatingText(pu.x, pu.y - 25, 'TRIPLE SHOT!', '#ff8800');
      break;
    case 'pcr':
      rapidFire = 360; // 6 seconds
      player.fireRate = 4;
      spawnFloatingText(pu.x, pu.y - 25, 'RAPID FIRE!', '#ff4444');
      break;
    case 'plasmid':
      shieldHP = 3;
      spawnFloatingText(pu.x, pu.y - 25, 'SHIELD x3!', '#ff44ff');
      break;
    case 'uv':
      SFX.uvFlash();
      uvFlashTimer = 30;
      // Kill all enemies
      for (const e of enemies) {
        if (e.alive) {
          e.alive = false;
          score += e.points;
          spawnExplosion(e.x, e.y, '#ddaaff', 8);
        }
      }
      // Clear enemy bullets
      enemyBullets = [];
      spawnFloatingText(BASE_W/2, BASE_H/2, 'UV TRANSILLUMINATOR!', '#aa88ff');
      break;
    case 'comb':
      SFX.gelComb();
      combSlowTimer = 300; // 5 seconds
      spawnFloatingText(pu.x, pu.y - 25, 'GEL COMB!', '#44ddff');
      break;
    case 'extralife':
      lives = Math.min(lives + 1, 5);
      spawnFloatingText(pu.x, pu.y - 25, '+1 LIFE!', '#44ff44');
      break;
  }
}

function updatePowerups() {
  // Decrement active timers
  if (tripleShot > 0) tripleShot--;
  if (rapidFire > 0) {
    rapidFire--;
    if (rapidFire <= 0) player.fireRate = player.baseFireRate;
  }
  if (combSlowTimer > 0) combSlowTimer--;
  if (uvFlashTimer > 0) uvFlashTimer--;

  // Move and check collision
  for (let i = powerups.length - 1; i >= 0; i--) {
    const pu = powerups[i];
    pu.y += pu.vy;
    pu.life--;
    pu.bobPhase += 0.08;

    // Magnetism — drift toward player when within 120px
    const dx = player.x - pu.x;
    const dy = player.y - pu.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 120 && dist > 0) {
      const pull = (1 - dist / 120) * 2.5;
      pu.x += (dx / dist) * pull;
      pu.y += (dy / dist) * pull;
    }

    // Collect
    if (rectsOverlap(pu.x, pu.y, 16, 16, player.x, player.y, player.w, player.h)) {
      activatePowerup(pu);
      powerups.splice(i, 1);
      continue;
    }

    if (pu.y > BASE_H + 20 || pu.life <= 0) {
      powerups.splice(i, 1);
    }
  }
}

function drawPowerups() {
  for (const pu of powerups) {
    ctx.save();
    const bx = pu.x + Math.sin(pu.bobPhase) * 3;
    ctx.translate(bx, pu.y);

    // Blinking when about to expire
    if (pu.life < 120 && frameCount % 6 < 3) { ctx.restore(); continue; }

    // Outer glow
    ctx.shadowColor = pu.color;
    ctx.shadowBlur = 10;
    ctx.strokeStyle = pu.color;
    ctx.lineWidth = 1.5;

    if (pu.type === 'plasmid') {
      // Draw as circle (plasmid)
      ctx.beginPath();
      ctx.arc(0, 0, 8, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = pu.color;
      ctx.globalAlpha = 0.3;
      ctx.fill();
      ctx.globalAlpha = 1;
    } else if (pu.type === 'uv') {
      // Draw as star/burst
      ctx.fillStyle = pu.color;
      for (let i = 0; i < 4; i++) {
        const a = (i / 4) * Math.PI * 2 + frameCount * 0.05;
        ctx.fillRect(Math.cos(a) * 6 - 1, Math.sin(a) * 6 - 1, 3, 3);
      }
      ctx.fillRect(-2, -2, 4, 4);
    } else if (pu.type === 'comb') {
      // Draw as comb teeth
      for (let t = -2; t <= 2; t++) {
        ctx.fillStyle = pu.color;
        ctx.fillRect(t * 4 - 1, -6, 2, 12);
      }
      ctx.fillRect(-9, 4, 18, 3);
    } else {
      // Default: rounded box
      ctx.strokeRect(-7, -7, 14, 14);
      ctx.fillStyle = pu.color;
      ctx.globalAlpha = 0.2;
      ctx.fillRect(-7, -7, 14, 14);
      ctx.globalAlpha = 1;
    }

    // Symbol
    ctx.fillStyle = '#ffffff';
    ctx.shadowBlur = 0;
    ctx.font = 'bold 8px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(pu.symbol, 0, 0);

    ctx.restore();
  }
}

function drawActivePowerupHUD() {
  let y = 32;
  ctx.font = '9px "Courier New", monospace';
  ctx.textAlign = 'left';
  ctx.shadowBlur = 0;

  if (tripleShot > 0) {
    const sec = Math.ceil(tripleShot / 60);
    ctx.fillStyle = '#ff8800';
    ctx.fillText('EtBr ' + sec + 's', 10, y);
    y += 11;
  }
  if (rapidFire > 0) {
    const sec = Math.ceil(rapidFire / 60);
    ctx.fillStyle = '#ff4444';
    ctx.fillText('PCR ' + sec + 's', 10, y);
    y += 11;
  }
  if (shieldHP > 0) {
    ctx.fillStyle = '#ff44ff';
    ctx.fillText('SHIELD x' + shieldHP, 10, y);
    y += 11;
  }
  if (combSlowTimer > 0) {
    const sec = Math.ceil(combSlowTimer / 60);
    ctx.fillStyle = '#44ddff';
    ctx.fillText('COMB ' + sec + 's', 10, y);
    y += 11;
  }
}

// --- Enemies ---
function spawnWave() {
  enemies = [];
  const rows = Math.min(3 + Math.floor(wave / 2), 6);
  const cols = Math.min(6 + Math.floor(wave / 3), 10);
  const spacingX = 36;
  const spacingY = 30;
  const startX = (BASE_W - (cols - 1) * spacingX) / 2;
  const startY = 40;

  const colors = ['#00ff88', '#44ffaa', '#88ffcc', '#00ddff', '#66eeff', '#aaffdd'];
  const brightColors = ['#ffffff', '#ccffee', '#88ffbb'];

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const isBright = Math.random() < 0.15;
      enemies.push({
        x: startX + c * spacingX,
        y: startY + r * spacingY,
        w: 24 + Math.random() * 8,
        h: 14 + Math.random() * 4,
        color: isBright ? brightColors[r % brightColors.length] : colors[r % colors.length],
        variant: r % 3,
        alive: true,
        hp: wave > 3 ? 2 : 1,
        points: (rows - r) * 10 + (isBright ? 50 : 0),
      });
    }
  }
  enemyDir = 1;
  enemySpeed = 0.3 + wave * 0.08;
  enemyDropTimer = 0;
  enemyFireTimer = 0;
}

let enemyDir = 1;
let enemySpeed = 0.3;
let enemyDropTimer = 0;
let enemyFireTimer = 0;
let enemyMoveTimer = 0;

function updateEnemies() {
  // Comb slow factor
  const slowFactor = combSlowTimer > 0 ? 3 : 1;

  enemyMoveTimer++;
  const moveInterval = Math.max(2, 10 - wave) * slowFactor;

  if (enemyMoveTimer >= moveInterval) {
    enemyMoveTimer = 0;

    let hitEdge = false;
    for (const e of enemies) {
      if (!e.alive) continue;
      if ((e.x + e.w/2 + enemyDir * enemySpeed * 6 > BASE_W - 10) ||
          (e.x - e.w/2 + enemyDir * enemySpeed * 6 < 10)) {
        hitEdge = true;
        break;
      }
    }

    if (hitEdge) {
      enemyDir *= -1;
      for (const e of enemies) {
        if (e.alive) e.y += combSlowTimer > 0 ? 3 : 8;
      }
    } else {
      for (const e of enemies) {
        if (e.alive) e.x += enemyDir * enemySpeed * 6;
      }
    }
  }

  // Enemy firing
  enemyFireTimer++;
  const fireInterval = (Math.max(20, 60 - wave * 5)) * slowFactor;
  if (enemyFireTimer >= fireInterval) {
    enemyFireTimer = 0;
    const alive = enemies.filter(e => e.alive);
    if (alive.length > 0) {
      const bottom = {};
      for (const e of alive) {
        const col = Math.round(e.x / 36);
        if (!bottom[col] || e.y > bottom[col].y) bottom[col] = e;
      }
      const bottoms = Object.values(bottom);
      const shooter = bottoms[Math.floor(Math.random() * bottoms.length)];
      const bSpeed = combSlowTimer > 0 ? 1.2 : (2.5 + wave * 0.2);
      enemyBullets.push({
        x: shooter.x,
        y: shooter.y + shooter.h / 2,
        vy: bSpeed,
        w: 2,
        h: 8,
      });
      SFX.enemyShoot();
    }
  }

  // Check if enemies reached player
  for (const e of enemies) {
    if (e.alive && e.y + e.h / 2 > player.y - 20) {
      lives = 0;
      gameOver();
      return;
    }
  }

  // Wave clear
  if (enemies.every(e => !e.alive)) {
    wave++;
    SFX.waveComplete();
    spawnWave();
  }
}

// --- Particles ---
function spawnExplosion(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 3 + 1;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 20 + Math.random() * 15,
      maxLife: 35,
      color,
      size: Math.random() * 3 + 1,
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.03;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    const alpha = p.life / p.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 4;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}

// --- Collision ---
function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax - aw/2 < bx + bw/2 && ax + aw/2 > bx - bw/2 &&
         ay - ah/2 < by + bh/2 && ay + ah/2 > by - bh/2;
}

// --- Lane lines (gel lanes) ---
function drawGelLanes() {
  ctx.strokeStyle = 'rgba(0, 255, 136, 0.04)';
  ctx.lineWidth = 1;
  for (let i = 1; i < 8; i++) {
    const x = (BASE_W / 8) * i;
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, BASE_H);
    ctx.stroke();
  }
  ctx.fillStyle = 'rgba(0, 255, 136, 0.06)';
  for (let i = 0; i < 8; i++) {
    const x = (BASE_W / 8) * i + BASE_W / 16;
    ctx.fillRect(x - 15, 0, 30, 8);
  }
}

// --- Ladder (scoring reference on left) ---
function drawLadder() {
  ctx.fillStyle = 'rgba(0, 255, 136, 0.12)';
  const sizes = [10, 8, 8, 7, 6, 6, 5, 5, 4, 3];
  for (let i = 0; i < sizes.length; i++) {
    const w = sizes[i] * 2;
    const y = 50 + i * 50;
    ctx.fillRect(8 - w/2 + 10, y, w, 3);
  }
}

// --- HUD ---
function drawHUD() {
  ctx.fillStyle = '#00ff88';
  ctx.shadowColor = '#00ff88';
  ctx.shadowBlur = 4;
  ctx.font = '14px "Courier New", monospace';
  ctx.textAlign = 'left';
  ctx.fillText('SCORE: ' + score, 10, 20);

  ctx.textAlign = 'center';
  ctx.fillText('WAVE ' + wave, BASE_W / 2, 20);

  ctx.textAlign = 'right';
  let livesStr = '';
  for (let i = 0; i < lives; i++) livesStr += '\u25B2 ';
  ctx.fillText(livesStr.trim(), BASE_W - 10, 20);

  ctx.shadowBlur = 0;

  drawActivePowerupHUD();
}

// --- Game Logic ---
function updatePlayer() {
  if (isDown('left')) player.x -= player.speed;
  if (isDown('right')) player.x += player.speed;
  if (isDown('up')) player.y -= player.speed * 0.5;
  if (isDown('down')) player.y += player.speed * 0.5;

  player.x = Math.max(15, Math.min(BASE_W - 15, player.x));
  player.y = Math.max(BASE_H - 100, Math.min(BASE_H - 20, player.y));

  if (player.fireCooldown > 0) player.fireCooldown--;
  if (player.invincible > 0) player.invincible--;

  if (isDown('fire') && player.fireCooldown <= 0) {
    SFX.shoot();

    if (tripleShot > 0) {
      // Triple spread shot
      bullets.push({ x: player.x, y: player.y - 14, vx: 0, vy: -5, w: 2, h: 10 });
      bullets.push({ x: player.x - 6, y: player.y - 12, vx: -0.8, vy: -4.8, w: 2, h: 10 });
      bullets.push({ x: player.x + 6, y: player.y - 12, vx: 0.8, vy: -4.8, w: 2, h: 10 });
    } else {
      bullets.push({ x: player.x, y: player.y - 14, vx: 0, vy: -5, w: 2, h: 10 });
    }
    player.fireCooldown = player.fireRate;
  }
}

function updateBullets() {
  for (let i = bullets.length - 1; i >= 0; i--) {
    bullets[i].y += bullets[i].vy;
    bullets[i].x += (bullets[i].vx || 0);
    if (bullets[i].y < -10 || bullets[i].x < -10 || bullets[i].x > BASE_W + 10) {
      bullets.splice(i, 1);
      continue;
    }

    // Hit enemy
    let removed = false;
    for (const e of enemies) {
      if (!e.alive) continue;
      if (rectsOverlap(bullets[i].x, bullets[i].y, bullets[i].w, bullets[i].h,
                        e.x, e.y, e.w, e.h)) {
        e.hp--;
        if (e.hp <= 0) {
          e.alive = false;
          score += e.points;
          spawnExplosion(e.x, e.y, e.color, 12);
          enemySpeed += 0.02;
          SFX.kill();
          maybeSpawnPowerup(e.x, e.y);
        } else {
          spawnExplosion(e.x, e.y, '#ffffff', 4);
          SFX.hit();
        }
        bullets.splice(i, 1);
        removed = true;
        break;
      }
    }
    if (removed) continue;
  }

  // Enemy bullets
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    enemyBullets[i].y += enemyBullets[i].vy;
    if (enemyBullets[i].y > BASE_H + 10) { enemyBullets.splice(i, 1); continue; }

    if (player.invincible <= 0 &&
        rectsOverlap(enemyBullets[i].x, enemyBullets[i].y, enemyBullets[i].w, enemyBullets[i].h,
                      player.x, player.y, player.w + (shieldHP > 0 ? 12 : 0), player.h + (shieldHP > 0 ? 12 : 0))) {
      enemyBullets.splice(i, 1);

      if (shieldHP > 0) {
        shieldHP--;
        SFX.hit();
        spawnExplosion(player.x, player.y - 10, '#ff66ff', 6);
        if (shieldHP <= 0) spawnFloatingText(player.x, player.y - 20, 'SHIELD DOWN', '#ff44ff');
      } else {
        lives--;
        shakeTimer = 10;
        spawnExplosion(player.x, player.y, '#ff4444', 15);
        SFX.playerHit();
        player.invincible = 60;
        if (lives <= 0) {
          gameOver();
          return;
        }
      }
    }
  }
}

function drawBullets() {
  // Player bullets
  const bColor = tripleShot > 0 ? '#ffaa44' : '#88ffdd';
  ctx.fillStyle = bColor;
  ctx.shadowColor = bColor;
  ctx.shadowBlur = 6;
  for (const b of bullets) {
    ctx.fillRect(b.x - b.w/2, b.y - b.h/2, b.w, b.h);
  }

  // Enemy bullets
  ctx.fillStyle = '#ff6644';
  ctx.shadowColor = '#ff6644';
  for (const b of enemyBullets) {
    ctx.fillRect(b.x - 1.5, b.y - 4, 3, 8);
    ctx.fillRect(b.x - 3, b.y - 1, 6, 2);
  }
  ctx.shadowBlur = 0;
}

function drawStarfield() {
  for (const s of starfield) {
    s.y += s.speed;
    if (s.y > BASE_H) { s.y = 0; s.x = Math.random() * BASE_W; }
    ctx.globalAlpha = s.alpha;
    ctx.fillStyle = '#335544';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// --- Gel gradient background ---
function drawBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, BASE_H);
  grad.addColorStop(0, '#0a0a0a');
  grad.addColorStop(0.3, '#080c0a');
  grad.addColorStop(1, '#050805');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, BASE_W, BASE_H);

  drawStarfield();
  drawGelLanes();
  drawLadder();

  // Comb slow visual — icy overlay
  if (combSlowTimer > 0) {
    ctx.fillStyle = 'rgba(68, 221, 255, 0.03)';
    ctx.fillRect(0, 0, BASE_W, BASE_H);
    // Horizontal comb lines
    ctx.strokeStyle = 'rgba(68, 221, 255, 0.08)';
    ctx.lineWidth = 1;
    for (let y = 0; y < BASE_H; y += 40) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(BASE_W, y);
      ctx.stroke();
    }
  }
}

// --- UV Flash overlay ---
function drawUVFlash() {
  if (uvFlashTimer <= 0) return;
  const alpha = uvFlashTimer / 30;
  // Purple UV flash
  ctx.fillStyle = `rgba(180, 100, 255, ${alpha * 0.5})`;
  ctx.fillRect(0, 0, BASE_W, BASE_H);
  // White center burst
  ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.3})`;
  ctx.fillRect(0, 0, BASE_W, BASE_H);
}

// --- Game Over ---
function gameOver() {
  gameState = 'gameover';
  SFX.gameOver();
  document.getElementById('final-score').textContent = 'SCORE: ' + score;
  document.getElementById('game-over-screen').classList.add('visible');
  document.getElementById('ui-overlay').classList.add('active');
  if (isTouchDevice) document.getElementById('touch-controls').classList.remove('visible');
}

function startGame() {
  ensureAudio();
  gameState = 'playing';
  score = 0;
  lives = 3;
  wave = 1;
  frameCount = 0;
  player.x = BASE_W / 2;
  player.y = BASE_H - 50;
  player.fireCooldown = 0;
  player.invincible = 0;
  player.fireRate = player.baseFireRate;
  bullets = [];
  enemyBullets = [];
  particles = [];
  enemies = [];
  powerups = [];
  floatingTexts = [];
  tripleShot = 0;
  rapidFire = 0;
  shieldHP = 0;
  uvFlashTimer = 0;
  combSlowTimer = 0;

  document.getElementById('start-screen').classList.remove('visible');
  document.getElementById('game-over-screen').classList.remove('visible');
  document.getElementById('ui-overlay').classList.remove('active');
  if (isTouchDevice) document.getElementById('touch-controls').classList.add('visible');

  spawnWave();
}

// --- Main Loop ---
function gameLoop() {
  frameCount++;

  ctx.save();
  if (shakeTimer > 0) {
    shakeTimer--;
    ctx.translate(
      (Math.random() - 0.5) * shakeTimer,
      (Math.random() - 0.5) * shakeTimer
    );
  }

  drawBackground();

  if (gameState === 'playing') {
    updatePlayer();
    updateEnemies();
    updateBullets();
    updatePowerups();
    updateParticles();
    updateFloatingTexts();

    // Draw enemies
    for (const e of enemies) {
      if (!e.alive) continue;
      // Comb tint: enemies flash blue when slowed
      if (combSlowTimer > 0 && frameCount % 20 < 10) {
        drawDNABand(e.x, e.y, e.w, e.h, '#4488aa', e.variant);
      } else {
        drawDNABand(e.x, e.y, e.w, e.h, e.color, e.variant);
      }
    }

    drawPowerups();
    drawBullets();

    // Draw player
    if (player.invincible <= 0 || frameCount % 4 < 2) {
      drawPlayer(player.x, player.y);
    }

    drawParticles();
    drawFloatingTexts();
    drawUVFlash();
    drawHUD();
  } else if (gameState === 'menu') {
    updateParticles();
    drawParticles();
    for (let i = 0; i < 5; i++) {
      const bx = 80 + i * 60;
      const by = 200 + Math.sin(frameCount * 0.02 + i) * 20;
      drawDNABand(bx, by, 26, 14, '#00ff88', i % 3);
    }
  } else if (gameState === 'gameover') {
    ctx.globalAlpha = 0.3;
    for (const e of enemies) {
      if (!e.alive) continue;
      drawDNABand(e.x, e.y, e.w, e.h, e.color, e.variant);
    }
    ctx.globalAlpha = 1;
    updateParticles();
    drawParticles();
  }

  ctx.restore();
  requestAnimationFrame(gameLoop);
}

// --- Events ---
document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);

document.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Enter') {
    if (gameState === 'menu' || gameState === 'gameover') {
      e.preventDefault();
      startGame();
    }
  }
});

gameLoop();
</script>
